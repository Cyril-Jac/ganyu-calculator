<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Build Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{
  --bg:#f2f6f9; --surface:#ffffff; --line:#d3dee7; --ink:#0f1c29; --ink-2:#465868; --muted:#6f8293;
  --accent:#0d6a96; --accent-ink:#ffffff; --bad:#b0291f; --bad-soft:#f9e0dd; --good:#1d7447; --good-soft:#dff1e6;
  --f-display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0b131b; --surface:#111c27; --line:#243647; --ink:#e4edf4; --ink-2:#a7b9c8; --muted:#7f93a5;
  --accent:#6cc3ea; --accent-ink:#06202e; --bad:#ff8a7e; --bad-soft:#40201d; --good:#5ccf8f; --good-soft:#163527; color-scheme:dark; } }
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body)}
[hidden]{display:none!important}
.center{min-height:100%; display:grid; place-items:center; padding:24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left))}
.card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px 24px}
h1{font-family:var(--f-display); font-size:26px; margin:0 0 4px; letter-spacing:-0.01em}
.sub{color:var(--ink-2); margin:0 0 20px; font-size:14px}
label{display:block; font-size:13px; font-weight:500; color:var(--ink-2); margin:12px 0 4px}
input{width:100%; font:inherit; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
input:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button{font:inherit; font-weight:600; cursor:pointer; border-radius:9px; border:1px solid transparent}
.primary{width:100%; margin-top:18px; padding:11px; background:var(--accent); color:var(--accent-ink)}
.primary[disabled]{opacity:.6; cursor:wait}
.msg{margin-top:14px; font-size:13.5px; padding:9px 11px; border-radius:8px}
.msg.bad{background:var(--bad-soft); color:var(--bad)} .msg.good{background:var(--good-soft); color:var(--good)}
.app{position:fixed; inset:0; display:flex; flex-direction:column}
.bar{display:flex; align-items:center; gap:12px; justify-content:space-between; padding:6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left)); padding-top:calc(6px + env(safe-area-inset-top)); background:var(--surface); border-bottom:1px solid var(--line); font-size:13px}
.bar b{font-family:var(--f-display)}
.bar .who{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.bar .acts{display:flex; gap:6px; flex:none}
.ghost{background:transparent; border-color:var(--line); color:var(--ink); padding:5px 10px; font-size:12.5px; font-weight:500}
iframe{flex:1; width:100%; border:0; background:var(--bg)}
dialog{border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); padding:22px; width:min(360px, calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
.row{display:flex; gap:8px; margin-top:16px}
.row button{flex:1; padding:9px}
.loading{color:var(--muted)}
</style>
</head>
<body>
<main id="login" class="center" hidden>
  <form class="card" id="loginForm" novalidate>
    <h1>Build Guide</h1>
    <p class="sub">Sign in with the email and password you were given.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="signin" type="submit">Sign in</button>
    <p class="msg bad" id="loginMsg" role="alert" hidden></p>
  </form>
</main>

<div id="boot" class="center"><p class="loading">Loading…</p></div>

<div id="app" class="app" hidden>
  <div class="bar">
    <span class="who"><b>Build Guide</b> · <span id="who"></span></span>
    <span class="acts"><button class="ghost" id="pwBtn" type="button">Change password</button><button class="ghost" id="outBtn" type="button">Sign out</button></span>
  </div>
  <iframe id="frame" title="Build Guide"></iframe>
</div>

<dialog id="pwDlg">
  <form id="pwForm" method="dialog" novalidate>
    <h1 style="font-size:20px">New password</h1>
    <label for="pw1">New password (at least 8 characters)</label>
    <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2">Type it again</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <p class="msg" id="pwMsg" role="alert" hidden></p>
    <div class="row"><button class="ghost" type="button" id="pwCancel">Close</button><button class="primary" style="margin:0" type="submit" id="pwSave">Save</button></div>
  </form>
</dialog>

<script src="vendor/supabase.js"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://gvxncxifsvbmboshrznj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4EDlsQV-vqebE8QJroPm0g_Bgjp_sBk'; // public key; access is enforced by row-level security
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const $ = id => document.getElementById(id);
  let blobUrl = null, loadedFor = null;

  function show(view){ $('boot').hidden = view!=='boot'; $('login').hidden = view!=='login'; $('app').hidden = view!=='app'; }
  function say(el, text, kind){ el.textContent = text; el.className = 'msg ' + (kind||'bad'); el.hidden = !text; }

  async function openApp(session){
    if(loadedFor === session.user.id) { show('app'); return; }
    show('boot');
    const name = (session.user.user_metadata && session.user.user_metadata.name) || session.user.email;
    $('who').textContent = 'signed in as ' + name;
    const { data, error } = await sb.from('app_files').select('content').eq('name','calculator').maybeSingle();
    if(error || !data){
      show('login'); say($('loginMsg'), error ? 'The guide could not load. Check your internet and try again.' : 'You are signed in, but this account cannot open the guide.');
      return;
    }
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(new Blob([data.content], {type:'text/html'}));
    $('frame').src = blobUrl; loadedFor = session.user.id; show('app');
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault(); say($('loginMsg'), '');
    const email = $('email').value.trim(), password = $('password').value;
    if(!email || !password){ say($('loginMsg'), 'Type your email and your password.'); return; }
    $('signin').disabled = true; $('signin').textContent = 'Signing in…';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    $('signin').disabled = false; $('signin').textContent = 'Sign in';
    if(error){ say($('loginMsg'), error.status===400 ? "That email and password don't match. Check for typos and try again." : 'Sign-in failed. Check your internet and try again.'); return; }
    $('password').value=''; openApp(data.session);
  });

  $('outBtn').addEventListener('click', async () => { await sb.auth.signOut(); loadedFor=null; $('frame').src='about:blank'; show('login'); });
  $('pwBtn').addEventListener('click', () => { $('pw1').value=''; $('pw2').value=''; say($('pwMsg'),''); $('pwDlg').showModal(); });
  $('pwCancel').addEventListener('click', () => $('pwDlg').close());
  $('pwForm').addEventListener('submit', async e => {
    e.preventDefault(); const a=$('pw1').value, b=$('pw2').value;
    if(a.length<8){ say($('pwMsg'),'Use at least 8 characters.'); return; }
    if(a!==b){ say($('pwMsg'),'The two passwords are not the same.'); return; }
    $('pwSave').disabled=true; const { error } = await sb.auth.updateUser({ password: a }); $('pwSave').disabled=false;
    if(error){ say($('pwMsg'), error.message && /different/i.test(error.message) ? 'Pick a password that is different from the old one.' : 'Could not save the new password. Try again.'); return; }
    say($('pwMsg'),'Saved. Use the new password next time you sign in.','good');
  });

  sb.auth.getSession().then(({ data }) => { if(data.session) openApp(data.session); else show('login'); });
  sb.auth.onAuthStateChange((event, session) => { if(event==='SIGNED_OUT'){ loadedFor=null; show('login'); } });
})();
</script>
</body>
</html>
